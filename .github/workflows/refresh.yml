name: Refresh COE forecast

on:
  schedule:
    # Daily 10:30 UTC (18:30 SGT) — bidding results publish on the 1st and
    # 3rd Wednesday ~16:00 SGT; refresh.py exits without changes on all
    # other days, so no commit and no redeploy happen.
    - cron: "30 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python refresh.py

      - name: Commit updated artifacts (only if anything changed)
        run: |
          if git diff --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/src/data/model_artifacts.json webapp/src/data/snapshot.json dataset/coe_bidding_raw.csv
          git commit -m "refresh: new bidding round artifacts"
          git push
